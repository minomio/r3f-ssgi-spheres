<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <!-- Base sphere color - blue -->
    <radialGradient id="base" cx="40%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#a0b8ff"/>
      <stop offset="35%" stop-color="#4060ff"/>
      <stop offset="75%" stop-color="#0a1a8b"/>
      <stop offset="100%" stop-color="#01031a"/>
    </radialGradient>
    <!-- Environment reflection band -->
    <radialGradient id="envrim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="88%" stop-color="#a0b8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a0b8ff" stop-opacity="0.0"/>
    </radialGradient>
    <!-- Main specular highlight -->
    <radialGradient id="spec" cx="36%" cy="28%" r="30%">
      <stop offset="0%" stop-color="white" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass transmission / inner glow -->
    <radialGradient id="glass" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#4060ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="24" cy="24" r="22"/>
    </clipPath>
  </defs>

  <!-- Base sphere -->
  <circle cx="24" cy="24" r="22" fill="url(#base)"/>
  <!-- Inner glass glow -->
  <circle cx="24" cy="24" r="22" fill="url(#glass)"/>
  <!-- Blue rim/env reflection from the ring lightformer -->
  <circle cx="24" cy="24" r="22" fill="url(#envrim)"/>

  <!-- Primary specular highlight -->
  <circle cx="24" cy="24" r="22" fill="url(#spec)"/>
  <!-- Tiny sharp specular dot -->
  <ellipse cx="18" cy="15" rx="3.5" ry="2.5" fill="white" opacity="0.7" clip-path="url(#circle)"/>
</svg>
